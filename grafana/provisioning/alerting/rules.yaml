apiVersion: 1

groups:
  - orgId: 1
    name: fraud-service
    folder: Fraud
    interval: 10s
    rules:
      - uid: fraud-ratio-high
        title: Доля фрода выше 1%
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: fraud_ratio выше 0.01
        labels: {}
        isPaused: false
        data:
          - refId: A
            datasourceUid: hw5-prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: hw5-prometheus
              editorMode: code
              expr: fraud_ratio
              instant: true
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0.01]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: stream-stopped
        title: Поток транзакций остановился
        condition: C
        for: 30s
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: rate(transactions_total[1m]) ниже 0.05
        labels: {}
        isPaused: false
        data:
          - refId: A
            datasourceUid: hw5-prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: hw5-prometheus
              editorMode: code
              expr: sum(rate(transactions_total[1m]))
              instant: true
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0.05]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
